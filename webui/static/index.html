<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradingAgents 控制台</title>
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/logo-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/logo-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/logo-180.png">
  <link rel="stylesheet" href="/console.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button" type="button" id="collapse-sidebar" aria-label="收起侧栏">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4.5h12M3 9h12M3 13.5h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="brand">
          <img class="brand-mark" src="/icons/logo.svg" width="22" height="22" alt="">
          <span class="brand-name">TradingAgents</span>
        </div>
      </div>
      <label class="topbar-search">
        <input id="command-search" type="search" placeholder="搜索命令或页面" aria-label="搜索命令或页面">
        <kbd>/</kbd>
      </label>
      <div class="topbar-right">
        <div class="topbar-identity">
          <strong id="identity-name">未登录</strong>
          <span>本地控制台</span>
        </div>
      </div>
    </header>
    <div class="shell-body">
      <aside class="sidebar" id="primary-sidebar">
        <div class="sidebar-section-label">分析</div>
        <button class="sidebar-create-button" type="button" id="create-analysis" aria-haspopup="menu" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>新建</button>
        <nav class="sidebar-nav" aria-label="主导航">
          <button class="nav-item nav-item--active" type="button" data-page="analyze" data-cli="start"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 13.5l3.2-4 2.4 2.3L14 5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>启动分析</button>
          <button class="nav-item" type="button" data-page="runs" data-cli="status"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 6v3.2l2.2 1.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>查看状态</button>
          <button class="nav-item" type="button" data-page="reports" data-cli="logs"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3.5h5.2L14 7.3V14.5H5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 3.7V7.4h3.7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>报告</button>
          <button class="nav-item" type="button" data-page="kline" data-cli="kline"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3.5v11M12.5 3.5v11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="3.5" y="6" width="3" height="5" rx=".5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="5" width="3" height="6.5" rx=".5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>K 线行情</button>
          <button class="nav-item" type="button" data-page="backtest" data-cli="cli backtest"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 12.5V5.5M7.5 12.5V8M11.5 12.5V6.5M15.5 12.5V4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>回测</button>
          <button class="nav-item" type="button" data-page="accounts" data-cli="auth-status"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="6.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 14.2c.7-2.1 2.4-3.2 4.5-3.2s3.8 1.1 4.5 3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>账户</button>
          <button class="nav-item" type="button" data-page="models" data-cli="login"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3.5" y="3.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9h4M9 7v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>模型</button>
        </nav>
        <div class="sidebar-footer">本地研究工作台</div>
      </aside>
      <main class="canvas">
        <section class="workspace-card">
          <div class="page" id="page"></div>
        </section>
      </main>
    </div>
  </div>
  <div id="portal"></div>
  <div id="toast-host" aria-live="polite"></div>
  <div id="session-banner-host"></div>
  <script src="/app.js"></script>
</body>
</html>
